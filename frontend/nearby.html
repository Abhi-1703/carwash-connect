<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearby Car Washes - CarWash Connect</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Free Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">🚗 CarWash <span>Connect</span></a>
      <ul class="nav-links" id="navbar-links"></ul>
    </div>
  </nav>

  <main class="container" style="padding-top:30px; padding-bottom:50px;">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; margin-bottom:20px;">
      <div>
        <h1 style="color:var(--secondary); font-size:1.8rem;">Nearby Car Wash Centers</h1>
        <p id="location-status" style="color:var(--text-muted); font-size:0.95rem;">Detecting your location...</p>
      </div>

      <div style="display:flex; gap:10px;">
        <button id="locate-btn" class="btn btn-primary btn-sm">📍 Re-detect Location</button>
      </div>
    </div>

    <!-- Search Box -->
    <div style="margin-bottom:25px;">
      <input type="text" id="search-input" class="form-control" placeholder="🔍 Search car wash by center name, street, or area..." style="box-shadow:var(--shadow);">
    </div>

    <!-- Interactive Leaflet Map Container -->
    <div id="map"></div>

    <!-- Distance-Sorted List of Car Wash Centers -->
    <div class="grid-3" id="carwash-list">
      <!-- Injected by nearby.js -->
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 CarWash Connect. College Project Presentation.</p>
    </div>
  </footer>

  <!-- Free Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/api.js"></script>
  <script src="js/map.js"></script>
  <script src="js/nearby.js"></script>
</body>
</html>
