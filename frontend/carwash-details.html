<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Center Details - CarWash Connect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">🚗 CarWash <span>Connect</span></a>
      <ul class="nav-links" id="navbar-links"></ul>
    </div>
  </nav>

  <main class="container" style="padding-top:30px; padding-bottom:60px;">
    <a href="nearby.html" style="font-weight:600; display:inline-block; margin-bottom:15px;">&larr; Back to Nearby Centers</a>

    <div style="background:white; border-radius:10px; overflow:hidden; border:1px solid #e2e8f0; box-shadow:var(--shadow-lg); margin-bottom:40px;">
      <img id="detail-img" src="https://images.unsplash.com/photo-1520340356584-f9917d1eea6f?auto=format&fit=crop&w=1200&q=80" style="width:100%; height:260px; object-fit:cover;" alt="Car Wash">
      <div style="padding:30px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;">
          <div>
            <h1 id="detail-name" style="color:var(--secondary); font-size:2rem; margin-bottom:6px;">Loading...</h1>
            <p id="detail-address" style="color:var(--text-muted); font-size:1.05rem; margin-bottom:8px;">📍 Address</p>
            <p id="detail-timing" style="color:var(--text-muted); font-size:0.95rem;">🕒 Operating Hours</p>
          </div>
          <div style="text-align:right;">
            <p id="detail-phone" style="font-size:1.1rem; font-weight:700; color:var(--primary-dark);">📞 Contact</p>
            <span id="detail-rating" style="display:inline-block; margin-top:8px; background:#fef3c7; color:#92400e; font-weight:bold; padding:4px 12px; border-radius:20px; font-size:0.85rem;">⭐ 4.8 Verified Partner</span>
          </div>
        </div>

        <p id="detail-desc" style="margin-top:20px; color:#475569; font-size:1rem; line-height:1.7; border-top:1px solid #f1f5f9; padding-top:15px;"></p>
      </div>
    </div>

    <!-- Available Wash Services Section -->
    <h2 style="color:var(--secondary); margin-bottom:20px;">Available Service Packages</h2>
    <div class="grid-3" id="services-grid">
      <p style="grid-column:1/-1; text-align:center; padding:30px; color:#64748b;">Loading available services...</p>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 CarWash Connect. College Project Presentation.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');

      if (!id) {
        alert('Invalid car wash ID');
        window.location.href = 'nearby.html';
        return;
      }

      try {
        const data = await apiFetch(`/carwashes/${id}`);
        const wash = data.carWash;
        const services = data.services || [];

        document.getElementById('detail-name').textContent = wash.name;
        document.getElementById('detail-address').textContent = '📍 ' + wash.address;
        document.getElementById('detail-timing').textContent = `🕒 Operating Hours: ${wash.openingTime} - ${wash.closingTime}`;
        document.getElementById('detail-phone').textContent = `📞 ${wash.phone}`;
        document.getElementById('detail-desc').textContent = wash.description || 'Welcome to our professional automotive care center.';
        
        // Update rating dynamically & show Demo badge if applicable
        const ratingBadge = document.getElementById('detail-rating');
        if (ratingBadge) {
          if (wash.isDefault) {
            ratingBadge.innerHTML = '⭐ 4.9 • <span style="background:#4338ca; color:#ffffff; padding:2px 8px; border-radius:10px; font-size:0.78rem;">Default Demo Centre</span>';
          } else {
            ratingBadge.textContent = `⭐ ${wash.rating || '4.8'} Verified Partner`;
          }
        }

        if (wash.imageUrl) {
          document.getElementById('detail-img').src = wash.imageUrl;
        }

        const grid = document.getElementById('services-grid');
        if (services.length === 0) {
          grid.innerHTML = `
            <div style="grid-column:1/-1; text-align:center; padding:40px 20px; background:#f8fafc; border-radius:10px; border:1px dashed #cbd5e1;">
              <div style="font-size:2.5rem; margin-bottom:10px;">📋</div>
              <h3 style="color:#0f172a; margin-bottom:8px;">No service packages listed yet for this centre.</h3>
              <p style="color:#64748b; font-size:0.95rem; max-width:540px; margin:0 auto 16px auto; line-height:1.5;">
                This partner centre is registered on CarWash Connect. If you manage <strong>${wash.name}</strong>, log in to your Provider Dashboard to configure wash packages and pricing.
              </p>
              <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
                <a href="login.html" class="btn btn-outline btn-sm">🔑 Provider Login</a>
                <a href="nearby.html" class="btn btn-primary btn-sm">🔍 Explore Other Centres</a>
              </div>
            </div>
          `;
          return;
        }

        grid.innerHTML = services.map(s => {
          const includedList = s.includedServices && s.includedServices.length > 0
            ? `
              <div style="margin:12px 0 16px 0; padding-top:10px; border-top:1px dashed #e2e8f0;">
                <strong style="font-size:0.78rem; color:#475569; text-transform:uppercase; letter-spacing:0.5px;">What's Included:</strong>
                <ul style="padding-left:18px; margin:6px 0 0 0; font-size:0.85rem; color:#334155; line-height:1.5;">
                  ${s.includedServices.map(item => `<li>${item}</li>`).join('')}
                </ul>
              </div>
            `
            : '';

          return `
            <div style="background:white; border-radius:10px; padding:25px; border:1px solid #e2e8f0; box-shadow:var(--shadow); display:flex; flex-direction:column;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 style="color:var(--secondary); font-size:1.2rem; margin:0;">${s.serviceName}</h3>
                <span style="font-size:1.3rem; font-weight:800; color:var(--primary);">₹${s.price}</span>
              </div>
              <p style="color:#64748b; font-size:0.9rem; margin-bottom:12px; flex:1;">${s.description}</p>
              ${includedList}
              <p style="font-size:0.85rem; color:#94a3b8; margin-bottom:16px;">⏱️ Estimated Duration: <strong>${s.estimatedDuration || '45 mins'}</strong></p>
              <a href="booking.html?washId=${wash._id}&serviceId=${s._id}" class="btn btn-primary" style="width:100%; text-align:center;">Book This Service</a>
            </div>
          `;
        }).join('');

      } catch (error) {
        alert('Failed to load center details: ' + error.message);
      }
    });
  </script>
</body>
</html>
